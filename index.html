<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morrow — International money transfers</title>
<style>
:root{--ever:#0f3d32;--ever2:#16533f;--lime:#c6f25e;--cream:#f6f1e6;--card:#fffdf8;--ink:#14231e;--mute:#5d6b65;--line:#e3dccb;--red:#b4362b;--r:18px;--f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}

.hdr-r{margin-left:auto;display:flex;gap:8px}.ghost{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px}

h1{font-family:var(--serif);font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}h2{font-family:var(--serif);font-size:28px;margin:0 0 6px;letter-spacing:-.01em}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 12px 30px -18px rgba(15,61,50,.25)}
.grid{display:grid;gap:20px}.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.hero{background:var(--ever);color:#fff;border-radius:28px;padding:36px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;overflow:hidden;position:relative;margin-bottom:24px}
.hero p{color:#cfe3da}.hero svg{width:100%;height:auto}
.btn{background:var(--lime);color:var(--ever);border:0;border-radius:999px;padding:13px 22px;font-weight:700;transition:transform .1s}.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.dark{background:var(--ever);color:#fff}.btn.line{background:transparent;border:1.5px solid var(--ever);color:var(--ever)}
.link{background:none;border:0;color:var(--ever2);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#efe8d6;color:#6b5a2b;border-radius:6px;padding:2px 7px;vertical-align:middle}
.bal{display:flex;flex-direction:column;gap:2px}.bal b{font-size:24px;font-family:var(--serif)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--ever);color:var(--lime);display:grid;place-items:center;font-weight:800;flex:none}
.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:13px}.r{text-align:right}
.steps{display:flex;gap:6px;margin:0 0 22px;flex-wrap:wrap}.steps button{border:0;background:#e9e2d0;color:var(--mute);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.steps button.done{background:#d9eab9;color:var(--ever)}.steps button.cur{background:var(--ever);color:var(--lime)}.steps button:disabled{cursor:default}
.amt{display:flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-top:6px}.amt:focus-within{border-color:var(--ever)}
.amt input{flex:1;border:0;outline:0;padding:14px 16px;font-size:26px;font-weight:700;min-width:0;background:transparent}
.amt select{border:0;border-left:1.5px solid var(--line);background:#faf6ec;padding:0 14px;font-weight:700;outline:0}
.lbl{font-size:13px;font-weight:700;color:var(--mute)}
.swap{display:flex;justify-content:center;margin:-4px 0}.swap button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px}
.breakdown{margin:16px 0;padding:14px 16px;background:#f3eedf;border-radius:12px;font-size:14px}.breakdown div{display:flex;justify-content:space-between;padding:3px 0}

.err{background:#fbe9e6;color:var(--red);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.opt.sel{border-color:var(--ever);box-shadow:0 0 0 3px rgba(198,242,94,.6)}.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}.opt.sel .dot{border:6px solid var(--ever)}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(1turn)}}
.receipt{max-width:560px;margin:0 auto;text-align:center}.stamp{display:inline-flex;align-items:center;gap:7px;background:#edf6db;border:1px solid #c9e29b;color:var(--ever);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:999px;margin:10px 0 16px}
.modal{position:fixed;inset:0;background:rgba(10,30,24,.5);display:none;place-items:center;z-index:60;padding:16px}.modal.on{display:grid}.modal .card{max-width:460px;width:100%}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}.chip.on{background:var(--ever);color:#fff;border-color:var(--ever)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:20px}
.mnav{display:none}
.fld{margin-bottom:12px;min-width:0}.fld input,.fld select{width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:0}.fld input:focus,.fld select:focus{border-color:var(--ever);box-shadow:0 0 0 3px rgba(198,242,94,.5)}.fld [aria-invalid=true]{border-color:var(--red)}.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.fg2{grid-template-columns:1fr}}
@media(max-width:820px){header{padding:12px 16px}nav{display:none}.hero,.g2,.g3{grid-template-columns:1fr}h1{font-size:34px}main{padding:22px 14px 110px}.hero{padding:24px}
.mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ever);z-index:40;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mnav button{background:none;border:0;color:#cfe3da;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px}.mnav button.on{color:var(--lime);background:rgba(198,242,94,.12)}}
</style></head><body>
<header><div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#c6f25e"/><path d="M7 20 L12 10 L15 16 L18 10 L23 20" fill="none" stroke="#0f3d32" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
<nav id="nav"></nav><div class="hdr-r"><button class="ghost" data-modal="help">Help</button><button class="ghost" data-modal="settings">Settings</button></div></header>
<main id="app"></main>
<div class="mnav" id="mnav"></div>
<footer>Rates: European Central Bank reference rates via <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter v2</a> (ECB provider).</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card" id="modalBody"></div></div>
<script>
"use strict";
/* ===== Pure functions (also exported for tests) ===== */
const API="https://api.frankfurter.dev/v2";
const PROVIDER="ecb"; // ECB reference rates only (never Frankfurter's blended multi-source rates)
const rateUrl=(f,t)=>API+"/providers/"+PROVIDER+"/rate/"+encodeURIComponent(f)+"/"+encodeURIComponent(t);
const CURRENCIES_URL=API+"/currencies?providers="+PROVIDER;
/* Keep only currencies ECB still publishes (end_date == newest end_date in list). */
function parseCurrencies(arr){if(!Array.isArray(arr)||!arr.length)throw new Error("Unexpected currencies response");
 const latest=arr.reduce((m,c)=>c&&c.end_date>m?c.end_date:m,"");const out={};
 for(const c of arr){if(c&&c.type==="currency"&&/^[A-Z]{3}$/.test(c.iso_code)&&c.end_date===latest)out[c.iso_code]=c.name}
 if(Object.keys(out).length<2)throw new Error("Too few currencies");return out}
const FEE={flat:{default:2.99},pct:0.006}; // fee: fixed + 0.6% of source amount
const DELIVERY={bank:{label:"Bank deposit",eta:"Usually 1–2 business days",extra:0},cash:{label:"Cash pickup",eta:"Usually within hours",extra:1.5},wallet:{label:"Mobile wallet",eta:"Usually minutes",extra:0.5}};
const PAY={card:{label:"Debit / credit card",extra:0},bankpay:{label:"Bank transfer",extra:0},balance:{label:"Balance",extra:0}};
const MAX_AMOUNT=1000000;
function decimals(cur){try{return new Intl.NumberFormat("en",{style:"currency",currency:cur}).resolvedOptions().maximumFractionDigits}catch(e){return 2}}
function roundTo(v,cur){const d=decimals(cur),f=10**d;return Math.round((v+Number.EPSILON)*f)/f}
function fmt(v,cur){return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,currencyDisplay:"code"}).format(v)}
function validateAmount(raw,cur){const t=String(raw).trim();if(t==="")return{ok:false,msg:"Enter an amount"};
 if(!/^(\d+|\d{1,3}(,\d{3})+)?(\.\d*)?$/.test(t)||t===".")return{ok:false,msg:t.includes(",")?"Use commas only as thousands separators (e.g. 1,000.50)":"Numbers only"};
 const s=t.replace(/,/g,"");if(s==="")return{ok:false,msg:"Enter an amount"};
 const v=Number(s);
 if(!Number.isFinite(v))return{ok:false,msg:"Invalid amount"};if(v<=0)return{ok:false,msg:"Amount must be greater than zero"};
 if(v>MAX_AMOUNT)return{ok:false,msg:"Maximum amount is 1,000,000"};const d=decimals(cur);const dp=(s.split(".")[1]||"").length;
 if(dp>d)return{ok:false,msg:cur+" supports "+d+" decimal place"+(d===1?"":"s")};return{ok:true,value:v}}
function validRate(r){return typeof r==="number"&&Number.isFinite(r)&&r>0}
function feeFor(amount,delivery,pay){const extra=(DELIVERY[delivery]?.extra||0)+(PAY[pay]?.extra||0);return FEE.flat.default+extra+amount*FEE.pct}
/* Fees are denominated in the source currency, deducted once from the amount sent. */
function computeQuote(amount,from,to,rate,delivery="bank",pay="card"){
 if(from===to)return{ok:false,msg:"Choose two different currencies"};
 if(!validRate(rate))return{ok:false,msg:"Rate unavailable"};
 if(!Number.isFinite(amount)||amount<=0)return{ok:false,msg:"Invalid amount"};
 const fee=roundTo(feeFor(amount,delivery,pay),from);const converted=roundTo(amount-fee,from);
 if(converted<=0)return{ok:false,msg:"Amount must exceed the fee of "+fmt(fee,from)};
 const received=roundTo(converted*rate,to);return{ok:true,amount:roundTo(amount,from),fee,converted,rate,received,total:roundTo(amount,from),from,to}}
function makeFetcher(fetchImpl,timeoutMs=8000){let seq=0;return async function(from,to){const id=++seq;const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeoutMs);
 const url=rateUrl(from,to);
 try{const res=await fetchImpl(url,{signal:ctl.signal});if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();
  if(id!==seq)return{stale:true};const rate=j&&j.rate;if(!j||j.base!==from||j.quote!==to||!validRate(rate)||!/^\d{4}-\d{2}-\d{2}$/.test(j.date))throw new Error("Unexpected response");
  return{ok:true,rate,date:j.date,url,fetchedAt:new Date()}}
 catch(e){if(id!==seq)return{stale:true};return{ok:false,err:e.name==="AbortError"?"Request timed out":e.message||"Network error",url}}finally{clearTimeout(t)}}}
/* ===== Recipient form (pure, testable) ===== */
const esc=s=>String(s==null?"":s).replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
const COUNTRIES={AU:["Australia","AUD"],BR:["Brazil","BRL"],CA:["Canada","CAD"],CN:["China","CNY"],CZ:["Czechia","CZK"],DK:["Denmark","DKK"],FR:["France","EUR"],DE:["Germany","EUR"],HK:["Hong Kong","HKD"],HU:["Hungary","HUF"],IS:["Iceland","ISK"],IN:["India","INR"],ID:["Indonesia","IDR"],IE:["Ireland","EUR"],IL:["Israel","ILS"],IT:["Italy","EUR"],JP:["Japan","JPY"],MY:["Malaysia","MYR"],MX:["Mexico","MXN"],NL:["Netherlands","EUR"],NZ:["New Zealand","NZD"],NO:["Norway","NOK"],PH:["Philippines","PHP"],PL:["Poland","PLN"],PT:["Portugal","EUR"],RO:["Romania","RON"],SG:["Singapore","SGD"],ZA:["South Africa","ZAR"],KR:["South Korea","KRW"],ES:["Spain","EUR"],SE:["Sweden","SEK"],CH:["Switzerland","CHF"],TH:["Thailand","THB"],TR:["Türkiye","TRY"],GB:["United Kingdom","GBP"],US:["United States","USD"]};
const FIELD_MAX={first:50,last:50,city:60,email:254,nick:30,bank:60,acct:34};
const NAME_RE=/^[\p{L}\p{M}](?:[\p{L}\p{M}'’. \-]*[\p{L}\p{M}.])?$/u;
const EMAIL_RE=/^[^\s@<>"'`(),;:\\]+@[^\s@<>"'`(),;:\\]+\.[^\s@<>"'`(),;:\\]{2,}$/;
const CTRL_RE=/[\u0000-\u001f\u007f]/;
const blankDraft=()=>({id:null,first:"",last:"",country:"",cur:"",city:"",email:"",nick:"",bank:"",acct:"",curTouched:false});
const clean=v=>String(v==null?"":v).replace(/\s+/g," ").trim();
function supportedCountries(currencies){return Object.entries(COUNTRIES).filter(([,v])=>!currencies||currencies[v[1]]).sort((a,b)=>a[1][0].localeCompare(b[1][0]))}
function validateRecipient(d,currencies){const v={},e={};for(const k of Object.keys(FIELD_MAX))v[k]=clean(d&&d[k]);
 v.country=clean(d&&d.country);v.cur=clean(d&&d.cur);
 for(const k of Object.keys(FIELD_MAX))if(v[k].length>FIELD_MAX[k])e[k]="Keep this under "+FIELD_MAX[k]+" characters";else if(CTRL_RE.test(v[k]))e[k]="Contains invalid characters";
 if(!e.first){if(!v.first)e.first="Enter the recipient's first name (or full name)";else if(!NAME_RE.test(v.first))e.first="Use letters, spaces, apostrophes, periods or hyphens"}
 if(!e.last&&v.last&&!NAME_RE.test(v.last))e.last="Use letters, spaces, apostrophes, periods or hyphens";
 if(!COUNTRIES[v.country])e.country="Choose the recipient's country";
 if(!v.cur)e.cur="Choose the currency they'll receive";else if(!/^[A-Z]{3}$/.test(v.cur)||(currencies&&!currencies[v.cur]))e.cur="This currency isn't supported by the rate source";
 if(!e.bank&&!v.bank)e.bank="Enter the recipient's bank or wallet name";
 if(!e.acct){const a=v.acct.replace(/[\s-]/g,"");if(!a)e.acct="Enter the recipient's account number or IBAN";else if(!/^[A-Za-z0-9]+$/.test(a))e.acct="Use letters and numbers only";else if(a.length<4)e.acct="That account number looks too short"}
 if(!e.email&&v.email&&!EMAIL_RE.test(v.email))e.email="Enter a valid email or leave it blank";
 return Object.keys(e).length?{ok:false,errors:e}:{ok:true,value:v}}
function recName(r){return r?clean((r.first||"")+" "+(r.last||"")):""}
function initials(r){const w=recName(r).split(" ").filter(Boolean);return (w.length>1?[...w[0]][0]+[...w[w.length-1]][0]:[...(w[0]||"?")].slice(0,2).join("")).toUpperCase()}
function acctMask(r){const a=clean(r&&r.acct).replace(/[\s-]/g,"");return a?"•••• "+a.slice(-4).toUpperCase():""}
function recPlace(r){return [r&&r.city,r&&COUNTRIES[r.country]?COUNTRIES[r.country][0]:""].filter(Boolean).join(", ")}
/* Insert or update by internal generated id; never duplicates on re-save. */
function upsertRecipient(list,value,id,genId){const i=id?list.findIndex(r=>r.id===id):-1;const rec={...value,id:i>=0?id:genId()};
 const out=list.slice();if(i>=0)out[i]=rec;else out.push(rec);return{list:out,rec}}
/* Highest step state allows (0 Amount,1 Recipient,2 Delivery,3 Review). */
function maxStep(q,recipient,to){if(!q||!q.ok)return 0;if(!recipient||recipient.cur!==to||q.to!==to)return 1;return 3}
function canConfirm(q,recipient,to,loading){return !loading&&!!q&&q.ok===true&&!!recipient&&recipient.cur===to&&q.to===to}
if(typeof module!=="undefined")module.exports={esc,COUNTRIES,FIELD_MAX,blankDraft,supportedCountries,validateRecipient,recName,initials,recPlace,acctMask,upsertRecipient,parseCurrencies,maxStep,canConfirm,rateUrl,CURRENCIES_URL,decimals,roundTo,validateAmount,validRate,computeQuote,makeFetcher,feeFor};
/* ===== App ===== */
if(typeof document!=="undefined"){
const $=s=>document.querySelector(s);
const BAL=[{cur:"USD",v:4280.15},{cur:"EUR",v:1312.4},{cur:"GBP",v:640}];
const ACT=[];
const S={view:"home",step:0,currencies:null,curErr:null,from:"USD",to:"EUR",amountRaw:"1000",rate:null,rateDate:null,rateUrl:null,fetchedAt:null,loading:false,rateErr:null,recipient:null,delivery:"bank",pay:"card",receipt:null,sent:[],filter:"all",note:"",recips:[],forms:{send:{draft:blankDraft(),err:{}},page:{draft:blankDraft(),err:{},open:false}},undo:null};
let idSeq=0;const genId=()=>"rcp-"+(++idSeq);
const byId=id=>S.recips.find(r=>r.id===id)||null;
const fetchRate=makeFetcher(fetch.bind(window));
const STEPS=["Amount","Recipient","Delivery & payment","Review"];
async function loadCurrencies(){S.curErr=null;try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);const r=await fetch(CURRENCIES_URL,{signal:ctl.signal});if(!r.ok)throw 0;S.currencies=parseCurrencies(await r.json());
 if(!S.currencies[S.from])S.from="EUR";if(!S.currencies[S.to])S.to=Object.keys(S.currencies).find(c=>c!==S.from);}catch(e){S.curErr="Couldn't load ECB-supported currencies from Frankfurter."}render();refresh()}
async function refresh(){if(!S.currencies)return;S.rate=null;S.rateErr=null;if(S.from===S.to){S.loading=false;render();return}
 S.loading=true;render();const r=await fetchRate(S.from,S.to);if(r.stale)return;S.loading=false;
 if(r.ok){S.rate=r.rate;S.rateDate=r.date;S.rateUrl=r.url;S.fetchedAt=r.fetchedAt}else{S.rateErr=r.err;S.rateUrl=r.url}render()}
function quote(){const v=validateAmount(S.amountRaw,S.from);if(!v.ok)return{ok:false,msg:v.msg,amountErr:true};return computeQuote(v.value,S.from,S.to,S.rate,S.delivery,S.pay)}
function go(view){S.view=view;if(view==="send"&&S.step>3)S.step=0;render();window.scrollTo(0,0)}
function opts(sel){return Object.entries(S.currencies||{}).map(([c,n])=>`<option value="${c}"${c===sel?" selected":""}>${c}</option>`).join("")}
function rateInfo(){if(S.from===S.to)return`<div class="err">Source and destination are the same. Pick a different currency.</div>`;
 if(S.loading)return`<div class="rateline"><span class="spin"></span> Fetching latest published reference rate…</div>`;
 if(S.rateErr)return`<div class="err"><b>Rate unavailable.</b> ${esc(S.rateErr)}. We never show estimated or cached rates. <button class="link" data-act="retry">Retry</button></div>`;
 if(!S.rate)return"";const inv=1/S.rate;
 return`<div class="rateline"><b style="color:var(--ink)">1 ${S.from} = ${S.rate} ${S.to}</b><span>· 1 ${S.to} ≈ ${inv.toPrecision(6)} ${S.from}</span></div>
 <div class="rateline">Latest published ECB reference rate · effective <b>${S.rateDate}</b> · <a href="${esc(S.rateUrl)}" target="_blank" rel="noopener">source</a> · <button class="link" data-act="retry">Refresh</button></div>
 <div class="mute" style="font-size:12px;margin-top:4px">European Central Bank reference rates via Frankfurter v2 (ECB provider only), published once per working day (~16:00 CET); weekends/holidays show the last working day. Not a live or guaranteed remittance rate.</div>`}
function breakdown(q,rateDate){return`<div class="breakdown"><div><span>You send</span><b>${fmt(q.amount,q.from)}</b></div><div><span>Fee</span><span>− ${fmt(q.fee,q.from)}</span></div><div><span>Amount converted</span><span>${fmt(q.converted,q.from)}</span></div><div><span>× ECB reference rate (${esc(rateDate||"—")})</span><span>${q.rate}</span></div><div style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Recipient gets</span><b>${fmt(q.received,q.to)}</b></div><div><span>Total you pay</span><b>${fmt(q.total,q.from)}</b></div></div>`}
function art(){return`<svg viewBox="0 0 320 240" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#c6f25e"/><stop offset="1" stop-color="#7fd4a8"/></linearGradient></defs>
<circle cx="160" cy="120" r="96" fill="none" stroke="#2c6b57" stroke-width="1.5"/><ellipse cx="160" cy="120" rx="44" ry="96" fill="none" stroke="#2c6b57"/><ellipse cx="160" cy="120" rx="96" ry="34" fill="none" stroke="#2c6b57"/><line x1="64" y1="120" x2="256" y2="120" stroke="#2c6b57"/>
<path d="M70 160 C120 40 210 40 262 92" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="6 7"/><path d="M90 70 C150 130 200 170 250 160" fill="none" stroke="#c6f25e" stroke-width="2" opacity=".6"/>
<circle cx="70" cy="160" r="8" fill="#c6f25e"/><circle cx="262" cy="92" r="8" fill="#c6f25e"/><circle cx="90" cy="70" r="5" fill="#fff"/><circle cx="250" cy="160" r="5" fill="#fff"/>
<rect x="196" y="22" width="96" height="40" rx="12" fill="#fffdf8"/><text x="244" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#0f3d32" font-family="system-ui">${S.from} → ${S.to}</text></svg>`}
function vHome(){const sent=S.sent.length;return`<section class="hero"><div><span class="tag" style="background:var(--lime);color:var(--ever)">Account overview</span><h1 style="margin-top:12px">Money that moves<br>like you do.</h1><p>Send across borders at the latest published reference rate, with fees you see upfront.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-go="send">Send money</button><button class="ghost" data-go="recipients">Recipients</button></div></div><div>${art()}</div></section>
<div class="grid g3">${BAL.map(b=>`<div class="card bal"><span class="mute">${b.cur} balance</span><b>${fmt(b.v,b.cur)}</b></div>`).join("")}</div>
<div class="grid g2" style="margin-top:20px"><div class="card"><h3>Recent activity</h3>${actRows(3)}<button class="link" data-go="activity">View all activity</button></div>
<div class="card"><h3>Quick quote</h3>${S.currencies?`<p class="mute" style="margin:0 0 8px">${S.from} → ${S.to}</p>${rateInfo()}<div style="margin-top:14px"><button class="btn dark" data-go="send">Start a transfer</button></div>`:(S.curErr?`<div class="err">${S.curErr} <button class="link" data-act="reload">Retry</button></div>`:`<span class="spin"></span>`)}${sent?`<p class="mute">${sent} transfer(s) sent.</p>`:""}</div></div>`}
function actRows(n){const all=[...S.sent.map(r=>({who:recName(r.recipient),ini:initials(r.recipient),what:"Sent",amt:"−"+fmt(r.q.total,r.q.from),get:fmt(r.q.received,r.q.to),d:"Today",st:"Processing",rid:r.id})),...ACT];
 const f=all.filter(a=>S.filter==="all"||(S.filter==="sent"?a.what.startsWith("Sent"):a.what==="Received")).slice(0,n);
 return f.length?f.map(a=>`<div class="row"><div class="av">${esc(a.ini)}</div><div class="grow"><b>${esc(a.who)}</b><div class="mute">${a.what} · ${a.d}</div></div><div class="r"><b>${a.amt}</b><div class="mute">${a.get||""} ${a.st}</div>${a.rid?`<button class="link" data-receipt="${esc(a.rid)}">Receipt</button>`:""}</div></div>`).join(""):`<p class="mute">Nothing here yet.</p>`}
function vActivity(){return`<h2>Activity</h2><p class="sub">Your transfer history.</p><div class="card"><div class="filters">${["all","sent","received"].map(f=>`<button class="chip${S.filter===f?" on":""}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div>${actRows(99)}</div>`}
function recRow(r,actions){return`<div class="row"><div class="av">${esc(initials(r))}</div><div class="grow"><b>${esc(recName(r))}</b>${r.nick?` <span class="mute">“${esc(r.nick)}”</span>`:""}<div class="mute">${esc(recPlace(r))} · receives ${esc(r.cur)}${r.email?" · "+esc(r.email):""}${r.acct?" · "+esc(acctMask(r)):""}</div></div>${actions}</div>`}
function vRecipients(){const F=S.forms.page;return`<h2>Recipients</h2><p class="sub">People you send to.</p>
${S.undo?`<div class="breakdown" role="status" style="display:flex;justify-content:space-between;align-items:center">Removed ${esc(recName(S.undo.rec))}. <button class="link" data-act="undo">Undo</button></div>`:""}
<div class="grid g2"><div class="card"><h3>Saved recipients</h3>${S.recips.length?S.recips.map(r=>recRow(r,`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn line" data-sendto="${esc(r.id)}">Send</button><button class="link" data-edit="${esc(r.id)}">Edit</button><button class="link" data-remove="${esc(r.id)}">Remove</button></div>`)).join(""):`<p class="mute">No recipients yet. Add one to get started — or just start a transfer and fill in the form there.</p>`}</div>
<div class="card">${F.open?`<h3>${F.draft.id?"Edit recipient":"Add a recipient"}</h3>${recForm("page")}<div class="actions"><button class="btn line" data-act="cancelpage">Cancel</button><button class="btn" data-act="savepage">Save recipient</button></div>`:`<h3>Add a recipient</h3><p class="mute">Name, country and the currency they receive. No bank, card or ID numbers needed to save a recipient.</p><button class="btn dark" data-act="openpage">Add recipient</button>`}</div></div>`}
function recForm(k){const F=S.forms[k],d=F.draft,e=F.err;if(!d.id&&!d.curTouched&&!d.country&&!d.cur&&k==="send")d.cur=S.to;
 const fld=(f,label,type,opt,ac)=>{const id=k+"-"+f;return`<div class="fld"><label class="lbl" for="${id}">${label}${opt?' <span class="mute">(optional)</span>':""}</label><input id="${id}" data-form="${k}" data-f="${f}" type="${type}" maxlength="${FIELD_MAX[f]}" autocomplete="off" autocapitalize="${type==="email"?"off":"words"}" spellcheck="false" value="${esc(d[f])}"${e[f]?` aria-invalid="true" aria-describedby="${id}-err"`:""}>${e[f]?`<div class="warn" id="${id}-err">${esc(e[f])}</div>`:""}</div>`};
 const sel=(f,label,options)=>{const id=k+"-"+f;return`<div class="fld"><label class="lbl" for="${id}">${label}</label><select id="${id}" data-form="${k}" data-f="${f}"${e[f]?` aria-invalid="true" aria-describedby="${id}-err"`:""}><option value="">Select…</option>${options}</select>${e[f]?`<div class="warn" id="${id}-err">${esc(e[f])}</div>`:""}</div>`};
 const countries=supportedCountries(S.currencies).map(([c,v])=>`<option value="${c}"${d.country===c?" selected":""}>${esc(v[0])}</option>`).join("");
 const curs=Object.keys(S.currencies||{}).map(c=>`<option value="${c}"${d.cur===c?" selected":""}>${c} · ${esc(S.currencies[c])}</option>`).join("");
 const note=k==="send"&&d.cur&&d.cur!==S.to?(d.cur===S.from?`<div class="warn">They'd receive ${esc(d.cur)}, which is also your source currency. Change “You send” on the Amount step first.</div>`:`<div class="mute" style="font-size:13px">Saving sets the destination currency to <b>${esc(d.cur)}</b> (currently ${esc(S.to)}); the quote refreshes.</div>`):"";
 return`<div class="form" role="group" aria-label="Recipient details"><p class="mute" style="font-size:13px;margin:0 0 10px">🔒 Recipient details are used only to set up your transfer.</p>
 <div class="fg2">${fld("first","First name (or full name)","text")}${fld("last","Last name","text",1)}</div>
 <div class="fg2">${sel("country","Country",countries)}${sel("cur","Receives currency",curs)}</div>${note}
 <div class="fg2">${fld("city","City","text",1)}${fld("nick","Nickname","text",1)}</div>
 ${fld("email","Email for delivery updates","email",1)}<div class="fg2">${fld("bank","Bank or wallet name","text")}${fld("acct","Account number / IBAN","text")}</div>
 <p class="mute" style="font-size:12px;margin:4px 0 0">Double-check the account number — your transfer is sent to this account.</p></div>`}
function saveForm(k){const F=S.forms[k],r=validateRecipient(F.draft,S.currencies);
 if(!r.ok){F.err=r.errors;render();const f=Object.keys(r.errors)[0];const el=document.getElementById(k+"-"+f);if(el)el.focus();return null}
 const u=upsertRecipient(S.recips,r.value,F.draft.id&&byId(F.draft.id)?F.draft.id:null,genId);S.recips=u.list;F.err={};F.draft={...u.rec,curTouched:true};
 if(S.recipient&&S.recipient.id===u.rec.id)S.recipient=u.rec;return u.rec}
function steps(){return`<div class="steps">${STEPS.map((s,i)=>`<button class="${i<S.step?"done":i===S.step?"cur":""}" ${i<S.step?`data-step="${i}"`:"disabled"}>${i+1}. ${s}</button>`).join("")}</div>`}
function vSend(){if(S.step===4)return vReceipt(S.receipt);
 if(!S.currencies)return S.curErr?`<div class="card"><div class="err">${S.curErr} Transfers are blocked until rates are available.</div><button class="btn" data-act="reload">Retry</button></div>`:`<div class="card"><span class="spin"></span> Loading supported currencies…</div>`;
 const q=quote();if(!S.loading&&!S.rateErr)S.step=Math.min(S.step,maxStep(q,S.recipient,S.to));let body="";
 if(S.step===0){const v=validateAmount(S.amountRaw,S.from);body=`<h2>How much are you sending?</h2><p class="sub">Only currencies supported by the rate source are listed.</p>
 <label class="lbl" for="amt">You send</label><div class="amt"><input id="amt" inputmode="decimal" autocomplete="off" value="${esc(S.amountRaw)}" aria-label="Amount"><select id="from" aria-label="Source currency">${opts(S.from)}</select></div>
 <div class="warn" id="amtWarn">${v.ok?"":esc(v.msg)}</div>
 <div class="swap"><button data-act="swap" aria-label="Reverse currencies" title="Reverse">⇅</button></div>
 <label class="lbl">Recipient gets</label><div class="amt"><input id="recv" readonly value="${q.ok?new Intl.NumberFormat(undefined,{minimumFractionDigits:decimals(S.to),maximumFractionDigits:decimals(S.to)}).format(q.received):"—"}" aria-label="Recipient gets"><select id="to" aria-label="Destination currency">${opts(S.to)}</select></div>
 <div style="margin-top:14px" id="rate">${rateInfo()}</div><div id="bd">${q.ok?breakdown(q,S.rateDate):(!q.amountErr&&S.rate&&q.msg?`<div class="warn">${esc(q.msg)}</div>`:"")}</div>
 <div class="actions"><button class="btn line" data-go="home">Cancel</button><button class="btn" id="next0" data-next ${q.ok?"":"disabled"}>Continue</button></div>`}
 if(S.step===1){const F=S.forms.send;body=`<h2>Who are you sending to?</h2><p class="sub">Enter recipient details. You'll pick delivery next.</p>
 ${S.recips.length?`<div class="filters" aria-label="Saved recipients"><span class="mute" style="align-self:center;font-size:13px">Saved recipients:</span>${S.recips.map(r=>`<button class="chip${F.draft.id===r.id?" on":""}" data-pick="${esc(r.id)}">${esc(recName(r))} · ${esc(r.cur)}</button>`).join("")}<button class="chip${F.draft.id?"":" on"}" data-act="newrec">+ New recipient</button></div>`:""}
 ${recForm("send")}
 <div style="margin-top:6px">${rateInfo()}</div>${S.recipient&&q.ok?breakdown(q,S.rateDate):""}
 <div class="actions"><button class="btn line" data-back>Back</button><button class="btn" data-act="saverec" ${q.ok||S.loading||S.rateErr?"":"disabled"}>Save &amp; continue</button></div>`}
 if(S.step===2){body=`<h2>Delivery & payment</h2><p class="sub">Choose a delivery method and how to pay.</p><h3>Delivery method</h3>${Object.entries(DELIVERY).map(([k,d])=>`<button class="opt${S.delivery===k?" sel":""}" data-del="${k}"><span class="dot"></span><span class="grow"><b>${d.label}</b><br><span class="mute">${d.eta} · fee +${fmt(d.extra,S.from)}</span></span></button>`).join("")}
 <h3 style="margin-top:16px">Pay with</h3>${Object.entries(PAY).map(([k,d])=>`<button class="opt${S.pay===k?" sel":""}" data-pay="${k}"><span class="dot"></span><span class="grow"><b>${d.label}</b><br><span class="mute">Fee +${fmt(d.extra,S.from)}</span></span></button>`).join("")}
 ${q.ok?breakdown(q,S.rateDate):`<div class="err">${esc(q.msg)}</div>`}<div class="actions"><button class="btn line" data-back>Back</button><button class="btn" data-next ${q.ok?"":"disabled"}>Review</button></div>`}
 if(S.step===3){const r=S.recipient;body=`<h2>Review your transfer</h2><p class="sub">Check everything before you confirm.</p>
 <div class="row"><div class="grow"><span class="mute">Recipient</span><br><b>${esc(recName(r))}</b> · ${esc(recPlace(r))} · receives ${esc(r.cur)}${r.email?`<br><span class="mute">${esc(r.email)}</span>`:""}${r.acct?`<br><span class="mute">${esc(r.bank||"Bank / wallet")} · ${esc(acctMask(r))}</span>`:""}</div><button class="link" data-step="1">Edit</button></div>
 <div class="row"><div class="grow"><span class="mute">Delivery / payment</span><br><b>${DELIVERY[S.delivery].label}</b> · ${PAY[S.pay].label}</div><button class="link" data-step="2">Edit</button></div>
 <div class="row"><div class="grow"><span class="mute">Amount</span><br><b>${q.ok?fmt(q.amount,q.from):"—"}</b></div><button class="link" data-step="0">Edit</button></div>
 ${q.ok?breakdown(q,S.rateDate):`<div class="err">${esc(q.msg)}</div>`}<div style="margin:8px 0">${rateInfo()}</div>
 <div class="actions"><button class="btn line" data-back>Back</button><button class="btn" data-act="confirm" ${canConfirm(q,S.recipient,S.to,S.loading)?"":"disabled"}>Confirm transfer</button></div>`}
 return`<div style="max-width:620px;margin:0 auto">${steps()}<div class="card">${body}</div></div>`}
function vReceipt(rc){if(!rc)return"";const q=rc.q;return`<div class="receipt card"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#c6f25e"/><path d="M20 33l8 8 16-18" fill="none" stroke="#0f3d32" stroke-width="4" stroke-linecap="round"/></svg>
<h2>Transfer confirmed</h2><div class="stamp"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Confirmed</div><p class="mute">Reference ${esc(rc.id)} · ${esc(rc.when)}</p><div style="text-align:left">
<div class="row"><div class="grow">To</div><b>${esc(recName(rc.recipient))}</b></div><div class="row"><div class="grow">Destination</div><b>${esc(recPlace(rc.recipient))} · ${esc(rc.recipient.cur)}</b></div>${rc.recipient.bank?`<div class="row"><div class="grow">Bank / wallet</div><b>${esc(rc.recipient.bank)}</b></div>`:""}${rc.recipient.acct?`<div class="row"><div class="grow">Account</div><b>${esc(acctMask(rc.recipient))}</b></div>`:""}<div class="row"><div class="grow">Delivery</div><b>${DELIVERY[rc.delivery].label}</b></div><div class="row"><div class="grow">Paid with</div><b>${PAY[rc.pay].label}</b></div>
${breakdown(q,rc.rateDate)}<div class="mute" style="font-size:12px">Rate: latest published ECB reference rate effective ${rc.rateDate} · <a href="${esc(rc.url)}" target="_blank" rel="noopener">source</a></div></div>
<div class="actions" style="justify-content:center"><button class="btn line" data-go="activity">View activity</button><button class="btn" data-act="new">Send another</button></div></div>`}
function render(){const views={home:vHome,send:vSend,activity:vActivity,recipients:vRecipients};
 const tabs=[["home","Home"],["send","Send"],["activity","Activity"],["recipients","Recipients"]];
 const nav=tabs.map(([k,l])=>`<button class="${S.view===k?"on":""}" data-go="${k}">${l}</button>`).join("");$("#nav").innerHTML=nav;$("#mnav").innerHTML=nav;
 const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;$("#app").innerHTML=views[S.view]();
 if(id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
function setPair(from,to){S.from=from;S.to=to;if(S.recipient&&S.recipient.cur!==to)S.recipient=null;refresh()}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="amt"){S.amountRaw=t.value;render();return}
 if(t.dataset.form&&t.tagName==="INPUT"&&S.forms[t.dataset.form]){const F=S.forms[t.dataset.form];F.draft[t.dataset.f]=t.value;if(F.err[t.dataset.f]){delete F.err[t.dataset.f];t.removeAttribute("aria-invalid");const w=document.getElementById(t.id+"-err");if(w)w.remove()}}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.form&&t.tagName==="SELECT"&&S.forms[t.dataset.form]){const F=S.forms[t.dataset.form],f=t.dataset.f;F.draft[f]=t.value;delete F.err[f];
  if(f==="cur")F.draft.curTouched=true;if(f==="country"&&!F.draft.curTouched){const c=COUNTRIES[t.value];if(c&&S.currencies&&S.currencies[c[1]])F.draft.cur=c[1]}render();return}if(e.target.id==="from")setPair(e.target.value,S.to);if(e.target.id==="to")setPair(S.from,e.target.value)});
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-go]");if(!t)return;const d=t.dataset;
 if(d.go){if(d.go!=="recipients")S.undo=null;go(d.go)}if(d.modal)modal(d.modal);if(d.filter){S.filter=d.filter;render()}
 if(d.sendto){const r=byId(d.sendto);if(!r)return;S.recipient=r;S.forms.send={draft:{...r,curTouched:true},err:{}};S.step=0;S.view="send";if(S.to!==r.cur){if(S.from===r.cur)S.from=S.to===r.cur?"USD":S.to;if(S.from===r.cur)S.from=r.cur==="USD"?"EUR":"USD";S.to=r.cur;refresh()}else render()}
 if(d.pick){const r=byId(d.pick);if(r){S.forms.send={draft:{...r,curTouched:true},err:{}};render()}}
 if(d.act==="newrec"){S.forms.send={draft:blankDraft(),err:{}};render()}
 if(d.act==="openpage"){S.forms.page={draft:blankDraft(),err:{},open:true};render();const el=document.getElementById("page-first");if(el)el.focus()}
 if(d.edit){const r=byId(d.edit);if(r){S.forms.page={draft:{...r,curTouched:true},err:{},open:true};render()}}
 if(d.act==="cancelpage"){S.forms.page={draft:blankDraft(),err:{},open:false};render()}
 if(d.act==="savepage"){if(saveForm("page")){S.forms.page={draft:blankDraft(),err:{},open:false};render()}}
 if(d.remove){const i=S.recips.findIndex(r=>r.id===d.remove);if(i>=0){const rec=S.recips[i];S.recips=S.recips.filter(r=>r.id!==rec.id);S.undo={rec,idx:i};if(S.recipient&&S.recipient.id===rec.id)S.recipient=null;if(S.forms.send.draft.id===rec.id)S.forms.send.draft.id=null;render()}}
 if(d.act==="undo"&&S.undo){const l=S.recips.slice();l.splice(Math.min(S.undo.idx,l.length),0,S.undo.rec);S.recips=l;S.undo=null;render()}
 if(d.act==="saverec"){const rec=saveForm("send");if(!rec)return;if(rec.cur===S.from){S.forms.send.err={cur:"Same as your source currency. Go Back and change “You send” first."};render();return}
  S.recipient=rec;S.step=2;if(S.to!==rec.cur){S.to=rec.cur;refresh()}else render();scrollTo(0,0)}
 if(d.del){S.delivery=d.del;render()}if(d.pay){S.pay=d.pay;render()}
 if("next" in d){S.step=Math.min(S.step+1,maxStep(quote(),S.recipient,S.to));render();scrollTo(0,0)}if("back" in d){S.step--;render()}if(d.step){S.step=Math.min(+d.step,maxStep(quote(),S.recipient,S.to));render()}
 if(d.receipt){S.receipt=S.sent.find(r=>r.id===d.receipt);S.step=4;S.view="send";render()}
 if(d.act==="swap")setPair(S.to,S.from);if(d.act==="retry")refresh();if(d.act==="reload")loadCurrencies();
 if(d.act==="close")$("#modal").classList.remove("on");
 if(d.act==="confirm"){const q=quote();if(S.step!==3||!S.recipient||!byId(S.recipient.id)||!canConfirm(q,S.recipient,S.to,S.loading)){render();return}const rc={id:"MRW-"+Math.random().toString(36).slice(2,8).toUpperCase(),when:new Date().toLocaleString(),q,recipient:S.recipient,delivery:S.delivery,pay:S.pay,rateDate:S.rateDate,url:S.rateUrl};S.sent.unshift(rc);S.receipt=rc;S.step=4;render();scrollTo(0,0)}
 if(d.act==="new"){S.step=0;S.recipient=null;S.receipt=null;S.forms.send={draft:blankDraft(),err:{}};render()}});
function modal(k){const M={help:`<h2>Help</h2><p>Morrow lets you send money across borders at the latest published reference rate, with fees you see upfront.</p><p>Exchange rates are the latest published European Central Bank reference rates (Frankfurter v2, ECB provider only, not blended sources) from <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter</a>; our fee is (${fmt(FEE.flat.default,"USD").replace("USD","")} + ${FEE.pct*100}% of amount, plus option surcharges, in the source currency).</p>`,
 settings:`<h2>Settings</h2><p>Default source currency</p><select id="defFrom" style="padding:8px;border-radius:10px">${opts(S.from)}</select>`,
};
 $("#modalBody").innerHTML=M[k]+`<div class="actions"><span></span><button class="btn" data-act="close">${k==="settings"?"Save & close":"Close"}</button></div>`;$("#modal").classList.add("on");
 const df=$("#defFrom");if(df)df.onchange=()=>setPair(df.value,df.value===S.to?S.from:S.to)}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("on")});
render();loadCurrencies();}
</script></body></html>
